name: Deploy Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployment base URL (e.g. https://staging.example.com)"
        required: true
        type: string
      retries:
        description: "Number of retries while deployment warms up"
        required: false
        default: "3"
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deploy smoke verification
        run: npm run verify:deploy -- --base-url "${{ inputs.base_url }}" --retries "${{ inputs.retries }}" --retry-delay-ms 5000
